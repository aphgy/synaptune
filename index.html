<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synaptune | A Synaptic Map of Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F4; --grid:#DDE3E9; --ink:#1B2733; --sub:#5B6B7A;
    --jp:#D6367F;      /* 日本の電子ポップ文化圏 */
    --club:#2563B0;    /* クラブミュージック圏 */
    --roots:#C98A2D;   /* ルーツ・レトロ圏 */
    --chara:#2E8B74;   /* キャラクター・アイドル文化圏 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    font-feature-settings:"palt" 1;
    font-kerning:normal;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px;}
  header{margin-bottom:18px;}
  .eyebrow{
    font-size:11px;letter-spacing:.28em;color:var(--sub);
    text-transform:uppercase;margin-bottom:8px;
  }
  h1{font-size:24px;font-weight:900;letter-spacing:.04em;line-height:1.3;}
  h1 span{font-weight:300;color:var(--sub);}

  .key{
    border:1px solid #CBD3DB;border-radius:6px;background:#F5F7F9;
    padding:10px 14px;margin:14px 0 10px;
    display:flex;flex-direction:column;gap:8px;
  }
  .key-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;
    font-size:13px;font-weight:700;color:var(--ink);}
  .key-item{display:inline-flex;align-items:center;gap:6px;}
  .key-item b{display:inline-block;width:12px;height:12px;border-radius:50%;}
  .mapbox{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px;
    background-color:#F5F7F9;
    border:1px solid #CBD3DB;border-radius:6px;
    position:relative;overflow:hidden;
  }
  #zoom{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:26px 28px;color:#fff;
    clip-path:circle(0px at var(--cx,50%) var(--cy,50%));
    transition:clip-path .55s cubic-bezier(.22,.9,.3,1);
    pointer-events:none;overflow-y:auto;
  }
  #zoom.open{clip-path:circle(150% at var(--cx) var(--cy));pointer-events:auto;}
  #zoom .z-inner{opacity:0;transform:translateY(8px);transition:opacity .35s .25s,transform .35s .25s;margin:auto 0;padding:30px 0 10px;max-height:100%;overflow-y:auto;}
  #zoom.open .z-inner{opacity:1;transform:none;}
  #zoom .z-fam{font-size:11px;font-weight:800;letter-spacing:.22em;opacity:.8;margin-bottom:4px;}
  #zoom .z-genre{font-size:23px;font-weight:900;letter-spacing:.03em;line-height:1.3;}
  #zoom .z-stat{display:flex;align-items:baseline;gap:8px;margin:10px 0 6px;}
  #zoom .z-hours{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  #zoom .z-unit{font-size:13px;font-weight:700;opacity:.85;}
  #zoom .z-share{font-size:12px;font-weight:700;opacity:.75;margin-left:auto;}
  #zoom .z-bar{height:5px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin-bottom:18px;}
  #zoom .z-bar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .5s .3s cubic-bezier(.22,.9,.3,1);width:0;}
  #zoom .z-label{font-size:11px;font-weight:800;letter-spacing:.18em;opacity:.72;margin-bottom:7px;
    display:flex;align-items:center;gap:8px;}
  #zoom .z-label::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.3);}
  #zoom .z-artists{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  #zoom .z-artists span{
    background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;white-space:nowrap;
  }
  #zoom .z-note{font-size:13px;line-height:1.95;letter-spacing:.015em;opacity:.95;}
  #zoom .z-playwrap{margin-top:18px;}
  #zoom .z-play iframe{display:block;width:100%;height:152px;border:0;border-radius:12px;}
  #zoom .z-close{
    position:absolute;top:12px;right:14px;
    font-size:24px;line-height:1;cursor:pointer;
    background:rgba(255,255,255,.18);border:none;color:#fff;
    width:36px;height:36px;border-radius:50%;
  }
  #map{display:block;width:100%;height:auto;}
  #map text{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-feature-settings:"palt" 1;}
  .axis{font-size:18px;fill:var(--ink);letter-spacing:.08em;font-weight:800;}
  .edge{stroke:#8B99A6;stroke-width:1.3;fill:none;opacity:.75;}
  .edgelabel{
    font-size:10px;fill:#48545F;letter-spacing:.04em;font-weight:700;
    paint-order:stroke;stroke:#F5F7F9;stroke-width:4px;
  }
  .node circle{cursor:pointer;transition:opacity .18s;stroke:#fff;stroke-width:1.5px;}
  .node-scale{transform-box:fill-box;transform-origin:center;transition:transform .22s cubic-bezier(.34,1.56,.44,1);}
  .node:hover .node-scale,.node.active .node-scale{transform:scale(1.1);}
  .node:hover circle,.node.active circle{opacity:1;}
  .node text{
    font-size:13px;font-weight:800;fill:var(--ink);
    pointer-events:none;paint-order:stroke;stroke:#F5F7F9;stroke-width:4px;
  }
  .node .hrs{font-size:10.5px;font-weight:700;fill:#3D4A56;stroke-width:3.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  footer{margin-top:14px;font-size:11.5px;color:#5B6B7A;line-height:1.8;letter-spacing:.015em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Synaptune</h1>
  </header>

  <div class="key">
    <div class="key-row">
      <span class="key-item"><svg width="86" height="26" viewBox="0 0 86 26"><circle cx="10" cy="13" r="6" fill="#8B99A6"/><circle cx="32" cy="13" r="11" fill="#8B99A6"/></svg>円の大きさ = 聴取時間</span>
      <span class="key-item"><svg width="52" height="26" viewBox="0 0 52 26"><line x1="2" y1="13" x2="50" y2="13" stroke="#8B99A6" stroke-width="1.6"/><rect x="10" y="5" width="32" height="15" rx="3" fill="#F5F7F9"/><text x="26" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#48545F">源流</text></svg>線 = 関係(源流・影響・人脈・派生)</span>
    </div>
    <div class="key-row">
      <span class="key-item"><b style="background:var(--jp)"></b>日韓ポップ</span>
      <span class="key-item"><b style="background:var(--club)"></b>クラブミュージック</span>
      <span class="key-item"><b style="background:var(--roots)"></b>ルーツ・レトロ</span>
      <span class="key-item"><b style="background:var(--chara)"></b>キャラクター文化</span>
      <span class="key-item"><b style="background:none;border:1.5px dashed var(--sub);"></b>音楽以外</span>
    </div>
  </div>

  <div class="mapbox">
    <svg id="map" viewBox="0 0 800 640" role="img" aria-label="ジャンル関係マップ"></svg>
    <div id="zoom">
      <button class="z-close" aria-label="閉じる">×</button>
      <div class="z-inner">
        <div class="z-fam"></div>
        <div class="z-genre"></div>
        <div class="z-stat">
          <span class="z-hours"></span><span class="z-unit">時間</span>
          <span class="z-share"></span>
        </div>
        <div class="z-bar"><i></i></div>
        <div class="z-label">主なアーティスト</div>
        <div class="z-artists"></div>
        <div class="z-label">傾向</div>
        <div class="z-note"></div>
        <div class="z-playwrap">
          <div class="z-label">プレイリスト</div>
          <div class="z-play"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>集計対象:上位1000アーティスト中、分類済みの約263時間(全370時間の71%)。</footer>
</div>

<script>
const W=800,H=640,PAD=54;
const px=v=>PAD+(W-2*PAD)*v/100;
const py=v=>PAD+(H-2*PAD)*v/100;

const FAM={jp:"#D6367F",club:"#2563B0",roots:"#C98A2D",chara:"#2E8B74",other:"#5B6B7A"};

const nodes=[
{id:"net", pl:"5s4Ff5rPmJPsi7krML1y9g",   name:"ネット発エレクトロニック", h:22.2, x:32,y:14, fam:"jp",   a:"tofubeats / KAGAMI / DE DE MOUSE / TAKU INOUE / Aiobahn / Moe Shop / TEMPLIME / パソコン音楽クラブ", note:"Maltine Records以降のネットレーベル文化と、その延長にある同人・クラブシーンの現在地。tofubeatsやTAKU INOUEのようにメジャーとクラブを往復する作家が中心で、渋谷系のポップ職人性をダンスミュージックの語法で更新した系譜と言えます。VTuber楽曲やkawaii bass(Moe Shop等)への供給源でもあり、このマップの各所へ人脈が伸びる「ハブ」です。"},
{id:"shibuya", pl:"3IoCxAjpHGWZasvlV7bujR",name:"渋谷系・エレクトロポップ", h:33.1, x:26,y:40, fam:"jp",   a:"CAPSULE / フレネシ / Instant Cytron / Serani Poji / YMCK / Cymbals / ピチカート・ファイヴ / Flipper's Guitar", note:"全ジャンル中で最大の聴取時間を占める、このマップの重心。90年代渋谷系の本流(ピチカート、Flipper's Guitar、Cymbals)から、中田ヤスタカ以降のエレクトロポップ(CAPSULE)、ゲーム音楽と交差する変わり種(Serani Poji、YMCK)までを含みます。「引用とポップ職人性」という渋谷系の美学が、他のすべての聴取領域を選ぶ際の基準になっている印象です。"},
{id:"vtuber", pl:"46Oqm8IQRvoWfDOj8DHcXc",name:"VTuber・バーチャル",       h:15.3, x:13,y:26, fam:"chara",a:"KMNZ / 星街すいせい / ピーナッツくん / HIMEHINA / Marpril / AZKi / 轟はじめ", note:"単なる推し文化ではなく、楽曲提供者で選んでいる形跡が濃い領域。KMNZやMarprilはネットレーベル人脈の作家が制作しており、ピーナッツくんはヒップホップ〜ハイパーポップ文脈で評価される存在です。「バーチャル」という枠を通して、実質的には現行の日本インディー電子音楽を聴いている構図です。"},
{id:"kindie", pl:"3SGU00KVbveQXDlvoqf6mY",name:"Kインディー",             h:5.9,  x:62,y:66, fam:"jp",   a:"Doorlesshouse / KIRIN / KIM PUREUM / Silica Gel / SUMIN / Parannoul", note:"最近開拓中の領域で、累積時間ではまだ小さいものの、Doorlesshouseは全体14位(2.4h)と急上昇中。インディーロックのDoorlesshouse・Silica Gel、レトロポップを演じるKIRIN、シューゲイザーのParannoul、R&B寄りのSUMINまで幅広く、K-POPの外側にある韓国のシーンを面で追い始めている段階です。"},
{id:"anime", pl:"42dSh7KyLoo4SwaERr3qPM", name:"アニメ・声優・キャラソン",  h:16.6, x:11,y:52, fam:"chara",a:"坂本真綾 / ClariS / ヒプノシスマイク / 電音部 / 初星学園 / 中島愛 / 林原めぐみ", note:"坂本真綾・中島愛という菅野よう子人脈のライン、ヒプノシスマイクや電音部のようにクラブミュージックの作家を起用するキャラクターIPのライン、90年代声優ポップ(林原めぐみ)の三層構造。特に電音部はネット発エレクトロニック圏との交差点にあたり、キャラ文化とクラブ文化を橋渡ししています。"},
{id:"idol", pl:"3iduan3olcU1yFi00KiP8h",  name:"アイドル",                h:6.7,  x:19,y:68, fam:"chara",a:"Negicco / SPEED / 太陽とシスコムーン / RYUTist / Especia / SANDAL TELEPHONE", note:"王道よりも「楽曲派」と呼ばれる系譜に寄った選択。Negicco・RYUTistはconnieや渋谷系人脈のプロデュース、Especiaはヴェイパーウェイヴ文脈で語られたグループです。太陽とシスコムーンはつんく♂のファンク趣味が最も出た変化球で、ここでも制作者基準の聴き方が一貫しています。"},
{id:"jpop", pl:"3U7HgVy9oxloOvI0f3hFmK",  name:"J-POP",                   h:26.3, x:31,y:74, fam:"jp",   a:"clammbon / KIRINJI / NONA REEVES / Perfume / 宇多田ヒカル / m-flo / 藤井風 / chelmico", note:"clammbon・KIRINJI・NONA REEVESといった音楽性の高い歌ものバンド勢から、90年代末〜00年代のダンス・R&B寄りメインストリーム(宇多田、m-flo)、現行の藤井風・chelmicoまで。打ち込みとグルーヴのあるポップスに絞られているのが特徴です。m-floはハウス圏(☆Taku)とも直結する存在で、ここでもクラブとの接点が選択基準になっています。"},
{id:"city", pl:"1JSr8pmERoR4TsccsqosWs",  name:"シティポップ・80s歌謡",     h:8.4,  x:40,y:88, fam:"roots",a:"杏里 / 中山美穂 / 菊池桃子 / RA MU / 八神純子 / YMO / Wink", note:"渋谷系とフューチャーファンク双方の「源流」にあたる層。角松敏生プロデュース期の杏里、和モノファンクの文脈で再評価されたRA MU(菊池桃子)、テクノ歌謡のWinkなど、DJ的な再発見の視点で選ばれた80年代です。単なる懐メロではなく、後年のリバイバル文脈から逆算した聴き方が見えます。"},
{id:"ff", pl:"4Qb8nLunpd6sIQsC313Hdh",    name:"フューチャーファンク",      h:4.3,  x:45,y:53, fam:"roots",a:"Night Tempo / Yung Bae / YUKIKA / Starjunk 95", note:"シティポップをハウス〜ディスコの文法でエディットする、日本と海外の中間に立つジャンル。聴取時間は小さいものの、シティポップ再評価とクラブミュージックを繋ぐ結節点としてマップ上の位置が重要です。YUKIKAのようにK-POP側からシティポップを演じる逆輸入例も含みます。"},
{id:"kpop", pl:"3O7VohXYGc67vI2m4DbR28",  name:"K-POP",                   h:9.9,  x:66,y:44, fam:"jp",   a:"NewJeans / aespa / ILLIT / f(x) / S.E.S. / Red Velvet / LE SSERAFIM", note:"S.E.S.(90年代)からf(x)、NewJeansまで、SMとその周辺を軸にした世代横断の聴き方。特にNewJeans以降はUKガラージ、ジャージークラブ、ハイパーポップの語彙を大胆に取り込み、K-POPが実質クラブミュージックの最前線になった時期と聴取が重なります。歌ものというよりトラック聴きに近い位置づけです。"},
{id:"hard", pl:"4LT8aUtYfcNdri49t0j2y2",  name:"ハードコア・ハードスタイル", h:10.0,  x:48,y:5,  fam:"club", a:"Da Tweekaz / Darren Styles / Force & Styles / D-Block & S-te-Fan / USAO / DJ Noriken / REDALiCE", note:"90年代UKハッピーハードコア(Force & Styles、Dougal)、現行ユーロ圏ハードスタイル(Da Tweekaz、D-Block & S-te-Fan)、そして日本のJ-core(USAO、DJ Noriken、REDALiCE)の三系統。J-core勢は音ゲーや同人シーンを介してネット発エレクトロニック圏と人脈が地続きです。BPMの速い多幸感という点で一貫しています。"},
{id:"edm", pl:"3AgxvZkQrfULd0ehHsPpl0",   name:"EDM・ベースミュージック",   h:12.8, x:67,y:9,  fam:"club", a:"Skrillex / Knock2 / Martin Garrix / Sub Focus / Hedex / Flume / Zomboy", note:"ビッグルーム(Garrix、W&W)、ベースミュージック(Skrillex、Knock2)、ドラムンベース(Sub Focus、Hedex)を含むフェス系の枠。Skrillex以降のサウンドデザイン志向と、Knock2ら新世代の再興期を追っており、単なる流行追いではなくプロダクション面への関心がうかがえます。"},
{id:"ukg", pl:"0ZfcbA5zu1hRhSH5FNxrya",   name:"UKガラージ・ベースライン",  h:17.8, x:87,y:16, fam:"club", a:"Sammy Virji / Soul Mass Transit System / DJ Q / Interplanetary Criminal / Shunji Fujii / Stones Taro / LADY'S ONLY / Todd Edwards", note:"2020年代のUKG再興をかなり深く追跡している領域。Sammy VirjiやInterplanetary Criminalの再興世代、DJ Qらベースライン勢、そして源流のTodd Edwardsまで縦に掘っています。Shunji Fujii、Stones Taro、LADY'S ONLY、That Fancy Iら日本人プロデューサーのUKG・ベースラインもまとまった量があり、シーンを英日両面から追っているのが特徴です。"},
{id:"house", pl:"1gcuDgCfHZkadlWHuWNw9z", name:"ハウス",                   h:35.4, x:80,y:47, fam:"club", a:"Todd Edwards / Kerri Chandler / Louie Vega / MAW / Joshwa / Mondo Grosso / DJ KAWASAKI / Jazztronik", note:"渋谷系と並ぶ第2の柱。NYソウルフルハウスの古典(Kerri Chandler、MAW、Louie Vega)、現行UKテックハウス(Joshwa)、そして日本のクロスオーバー(Mondo Grosso、Jazztronik、DJ KAWASAKI)まで。歌とグルーヴを重視するヴォーカルハウス中心で、ソウル〜ディスコの遺伝子を最も濃く残す聴き方です。"},
{id:"idm", pl:"3VMxmorqjkIlKTRfnpFIXh",   name:"IDM・テクノ",              h:4.2,  x:97,y:31, fam:"club", a:"Aphex Twin / Flying Lotus / Basic Channel / Deepchord / TOKiMONSTA", note:"機能性(踊らせること)から離れた実験寄りの電子音楽。Aphex Twinのブレインダンス、Basic Channel〜Deepchordのダブテクノ、Flying Lotus以降のビートミュージックを含みます。量は少ないながら、電子音響の「聴くための」極として押さえられている領域です。"},
{id:"soul", pl:"1MI44zVl1llBwhTaOHpiG3",  name:"ソウル・ファンク・ディスコ", h:11.7, x:81,y:74, fam:"roots",a:"Stevie Wonder / Earth, Wind & Fire / Chaka Khan / Quincy Jones / Incognito / Jamiroquai", note:"ハウスとR&B双方の源流にあたる層。70年代のStevie Wonder・EW&F、Quincy Jones、そしてUKのアシッドジャズ(Incognito、Jamiroquai)まで。ハウスのヴォーカル曲やシティポップの元ネタにあたる音楽を、系譜として遡って聴いている形です。"},
{id:"rnb", pl:"6eMOT662N5pqdM85kqPwkp",   name:"R&B・ニュージャックスウィング", h:9.8, x:58,y:82, fam:"roots",a:"Whitney Houston / Bobby Brown / Guy / TLC / Janet Jackson / MISIA / 三浦大知 / Crystal Kay / VivaOla", note:"Teddy Riley人脈(Guy、Bobby Brown、New Edition一族)を核とするNJS〜90s R&Bと、その日本側の受容(MISIA、Double、三浦大知)、現行のオルタナR&B(VivaOla、Friday Night Plans)、NJSを現代に演じる日本のHiiT FACTORYまで。スウィングビートという点でUKガラージとも音楽的に通底しており、J-POPのR&B化(90年代末)の源流でもあります。"},
{id:"aor", pl:"7mBM3ytUi3THChbELeRDYZ",   name:"洋楽ロック・AOR",           h:5.7,  x:90,y:88, fam:"roots",a:"Chicago / Journey / Boston / REO Speedwagon / Phil Collins", note:"産業ロック〜AORの王道。シティポップと同時代の空気を共有し、コード感やプロダクションの面で日本の80年代歌謡と相互に影響し合った層です。ロック枠でありながら、選ばれているのはメロウで洗練された「歌もの」寄りの楽曲群という点で、マップ全体の嗜好と矛盾しません。"},
];

["kpop","kindie",""],["city","kindie","影響",0.75,-12],
["net","anime","",0.5,-8],["jpop","house",""],["ff","kpop",""],
["rnb","ukg",""],["city","aor","影響"]
];

const svg=document.getElementById("map");
const SVGNS="http://www.w3.org/2000/svg";
const N=Object.fromEntries(nodes.map(n=>[n.id,n]));
const r=h=>8+Math.sqrt(h)*4.6;
const el=(tag,attrs)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};

/* axes — background chips behind labels for contrast, placed outside the plotted area (static) */
function axisLabel(x,y,txt,anchor,rot){
  const w=txt.length*17.5+20;
  const rotAttr=rot?`transform="rotate(${rot} ${x} ${y})"`:'';
  let bx=x-w/2;
  if(anchor==="start")bx=x-8;
  return `<g ${rotAttr}>
    <rect x="${bx}" y="${y-5}" width="${w}" height="12" rx="2" fill="#F6C453" opacity=".55"/>
    <text class="axis" x="${x}" y="${y}" text-anchor="${anchor}">${txt}</text>
  </g>`;
}
let axesSVG="";
axesSVG+=axisLabel(PAD+4,30,"クラブ・電子","start",0);
axesSVG+=axisLabel(PAD+4,H-14,"歌もの・生音","start",0);
axesSVG+=axisLabel(26,H/2,"日本","middle",-90);
axesSVG+=axisLabel(W-26,H/2,"海外","middle",90);
svg.innerHTML=axesSVG;

/* simulation state — n.x / n.y stay the design %s (used by zoom); sim runs in px on n.sx / n.sy */
const CX=W/2, CY=H/2, OFFSET=58;   // 初期の変位オフセット量(中心から外向き)
for(const n of nodes){
  n.hx=px(n.x); n.hy=py(n.y); n.rr=r(n.h);
  let dx=n.hx-CX, dy=n.hy-CY, d=Math.hypot(dx,dy)||1;   // 中心から各ノードへ向かう方向
  n.sx=n.hx+dx/d*OFFSET; n.sy=n.hy+dy/d*OFFSET;         // その方向へ一定量ずらした変位オフセットから開始
  n.vx=0; n.vy=0;
}

/* edges (live elements, repositioned every frame) */
const edgeObjs=[];
for(const edge of edges){
  const[a,b,l,t=0.5,dyOverride]=edge;
  const A=N[a],B=N[b];
  const dy=dyOverride!==undefined?dyOverride:-6;
  const line=el("line",{class:"edge"});
  svg.appendChild(line);
  let rect=null,text=null,w=0;
  if(l){
    w=l.length*10+10;
    rect=el("rect",{width:w,height:16,rx:4,fill:"#F5F7F9",opacity:".9"});
    text=el("text",{class:"edgelabel","text-anchor":"middle"});
    text.textContent=l;
    svg.appendChild(rect); svg.appendChild(text);
  }
  edgeObjs.push({a,b,t,dy,line,rect,text,w,rest:Math.hypot(B.hx-A.hx,B.hy-A.hy)});
}

/* nodes (live elements) */
for(const n of nodes){
  const gg=el("g",{class:"node","data-id":n.id});
  const scale=el("g",{class:"node-scale"});
  const cAttrs=n.fam==="other"
    ?{cx:0,cy:0,r:n.rr,"stroke-dasharray":"4 3",fill:"none",stroke:FAM.other,"stroke-width":2,opacity:".9"}
    :{cx:0,cy:0,r:n.rr,fill:FAM[n.fam],opacity:".82"};
  scale.appendChild(el("circle",cAttrs));
  gg.appendChild(scale);
  const ty=n.rr+13;
  const t1=el("text",{x:0,y:ty,"text-anchor":"middle"}); t1.textContent=n.name;
  const t2=el("text",{class:"hrs",x:0,y:ty+12,"text-anchor":"middle"}); t2.textContent=n.h+"h";
  gg.appendChild(t1); gg.appendChild(t2);
  gg.addEventListener("pointerenter",()=>{ hoverId=n.id; kick(); });          // ホバーで斥力ON→周囲を押しのける
  gg.addEventListener("pointerleave",()=>{ if(hoverId===n.id){ hoverId=null; kick(); } }); // 離すと張力で戻る
  svg.appendChild(gg);
  n.gEl=gg;
}

/* place every element from the current simulation state */
function layout(){
  for(const e of edgeObjs){
    const A=N[e.a],B=N[e.b];
    e.line.setAttribute("x1",A.sx.toFixed(2)); e.line.setAttribute("y1",A.sy.toFixed(2));
    e.line.setAttribute("x2",B.sx.toFixed(2)); e.line.setAttribute("y2",B.sy.toFixed(2));
    if(e.text){
      const lx=A.sx+(B.sx-A.sx)*e.t, ly=A.sy+(B.sy-A.sy)*e.t;
      e.rect.setAttribute("x",(lx-e.w/2).toFixed(2)); e.rect.setAttribute("y",(ly+e.dy-11).toFixed(2));
      e.text.setAttribute("x",lx.toFixed(2)); e.text.setAttribute("y",(ly+e.dy).toFixed(2));
    }
  }
  for(const n of nodes){
    n.gEl.setAttribute("transform",`translate(${n.sx.toFixed(2)} ${n.sy.toFixed(2)})`);
  }
}

/* 張力のあるバネ網の緩和運動:
   各ノードは定位置へのバネ(復元力)と、線=エッジのバネ(張力)で繋がれ、設計配置がその静止(釣り合い)状態。
   読み込み時はそこへオフセットをかけた状態から解放し、わずかにオーバーシュートして自然に落ち着く。
   減衰はやや弱め(軽い不足減衰)で、1回だけ穏やかに行き過ぎてから収束する — 段階的な不自然さがない単一の緩和。 */
const kHome=0.013, kEdge=0.005, damping=0.86;
const kHover=4200, hoverCap=1.1;                          // ホバー中のノードから周囲を押しのける斥力
let raf=0, still=0, hoverId=null;
function step(){
  for(const n of nodes){ n.ax=(n.hx-n.sx)*kHome; n.ay=(n.hy-n.sy)*kHome; }
  for(const e of edgeObjs){                              // エッジ張力: 設計時の長さを自然長とするバネ
    const a=N[e.a],b=N[e.b];
    let dx=b.sx-a.sx, dy=b.sy-a.sy, d=Math.hypot(dx,dy)||0.01;
    const f=(d-e.rest)*kEdge, ux=dx/d, uy=dy/d;
    a.ax+=ux*f; a.ay+=uy*f; b.ax-=ux*f; b.ay-=uy*f;
  }
  if(hoverId){                                            // ホバーしたノードの斥力を強める(周囲を押しのける)
    const h=N[hoverId];
    for(const n of nodes){
      if(n===h) continue;
      let dx=n.sx-h.sx, dy=n.sy-h.sy, d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
      const f=Math.min(kHover/d2,hoverCap), ux=dx/d, uy=dy/d;
      n.ax+=ux*f; n.ay+=uy*f;
    }
  }
  let maxv=0;
  for(const n of nodes){
    n.vx=(n.vx+n.ax)*damping; n.vy=(n.vy+n.ay)*damping;
    n.sx+=n.vx; n.sy+=n.vy;
    const s=Math.abs(n.vx)+Math.abs(n.vy); if(s>maxv)maxv=s;
  }
  layout();
  if(maxv>0.05){ still=0; raf=requestAnimationFrame(step); }        // まだ動いている
  else if(hoverId){ raf=0; }                                        // ホバー中は押しのけた状態で保持(スナップしない)
  else if(++still<10){ raf=requestAnimationFrame(step); }           // 静止確認
  else { raf=0; for(const n of nodes){ n.sx=n.hx; n.sy=n.hy; } layout(); } // 設計座標へ最終確定
}
function kick(){ if(!raf){ still=0; raf=requestAnimationFrame(step); } }   // 停止中なら再始動
layout();
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  for(const n of nodes){ n.sx=n.hx; n.sy=n.hy; } layout();   // 動きを抑える設定なら即静止
}else{
  kick();
}

const zoom=document.getElementById("zoom");
const zGenre=zoom.querySelector(".z-genre"),zFam=zoom.querySelector(".z-fam"),
      zHours=zoom.querySelector(".z-hours"),zShare=zoom.querySelector(".z-share"),
      zBar=zoom.querySelector(".z-bar i"),
      zArtists=zoom.querySelector(".z-artists"),zNote=zoom.querySelector(".z-note");
const FAMNAME={jp:"日韓ポップ圏",club:"クラブミュージック圏",roots:"ルーツ・レトロ圏",chara:"キャラクター文化圏",other:"音楽以外"};
const zPlayWrap=zoom.querySelector(".z-playwrap"),zPlay=zoom.querySelector(".z-play");
const TOTAL=263, MAXH=Math.max(...nodes.map(n=>n.h));

svg.querySelectorAll(".node").forEach(el=>{
  el.addEventListener("click",()=>{
    const n=N[el.dataset.id];
    // ノード中心の画面上の位置(%)を計算し、そこから円が広がる
    const box=svg.getBoundingClientRect();
    const cx=px(n.x)/W*100, cy=py(n.y)/H*100;
    zoom.style.transition="none";           // 座標の付け替え自体がアニメーションしないよう一時停止
    zoom.style.setProperty("--cx",cx+"%");
    zoom.style.setProperty("--cy",cy+"%");
    void zoom.offsetWidth;                  // リフローで新しい中心を確定
    zoom.style.transition="";               // トランジションを復帰してから展開
    zoom.style.background=n.fam==="other"?"#3D4A56":FAM[n.fam];
    zGenre.textContent=n.name;
    zFam.textContent=FAMNAME[n.fam];
    zHours.textContent=n.h;
    zShare.textContent=`分類済み全体の ${Math.round(n.h/TOTAL*100)}%`;
    zArtists.innerHTML=n.a.split(" / ").map(a=>`<span>${a}</span>`).join("");
    zNote.textContent=n.note;
    if(n.pl){
      zPlayWrap.style.display="";
      zPlay.innerHTML=`<iframe src="https://open.spotify.com/embed/playlist/${n.pl}?utm_source=generator" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    }else{
      zPlayWrap.style.display="none";
      zPlay.innerHTML="";
    }
    zBar.style.width="0";
    zoom.classList.add("open");
    requestAnimationFrame(()=>{zBar.style.width=(n.h/MAXH*100)+"%";});
  });
});
zoom.querySelector(".z-close").addEventListener("click",e=>{
  e.stopPropagation();
  zoom.classList.remove("open");
});
zoom.addEventListener("click",()=>zoom.classList.remove("open"));
</script>
